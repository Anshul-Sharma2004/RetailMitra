spring.application.name=KhatavaaniAI

spring.datasource.url=jdbc:postgresql://localhost:5432/khatavani_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# JWT Configuration (Yeh properties miss thi)

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Mail Configuration (Agar spring-boot-starter-mail pom me hai)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# OPENROUTER AI CONFIGURATION (Free Tier)
# ==========================================
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
# OpenRouter ka best free tool-calling model:
spring.ai.openai.chat.options.model=meta-llama/llama-3.1-8b-instruct:free
spring.ai.openai.chat.options.temperature=0.2